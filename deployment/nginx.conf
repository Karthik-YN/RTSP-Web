# OPTIONAL reverse proxy: serve the dashboard on port 80 (or 443).
# Install to /etc/nginx/sites-available/rtsp-manager and symlink into
# sites-enabled. Then set RTSPM_LISTEN_HOST=127.0.0.1 in
# /etc/rtsp-manager/rtsp-manager.env so :8080 is not reachable directly.
#
# RTSP (port 8554) does NOT go through nginx; MediaMTX serves it directly.

upstream rtsp_manager {
    server 127.0.0.1:8080;
    keepalive 8;
}

server {
    listen 80;
    listen [::]:80;
    server_name _;   # set to the server's fixed DNS name

    # Uploads: multi-GB videos are streamed straight to the backend, which
    # checks disk space before writing. Do NOT let nginx buffer the body to
    # its own temp dir first (that would double disk use and delay errors).
    client_max_body_size 64g;
    proxy_request_buffering off;
    proxy_buffering off;
    proxy_http_version 1.1;
    proxy_read_timeout 3600s;
    proxy_send_timeout 3600s;

    location / {
        proxy_pass http://rtsp_manager;
        proxy_set_header Host $host;
        proxy_set_header Connection "";
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
}
