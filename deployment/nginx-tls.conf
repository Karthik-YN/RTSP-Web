# HTTPS reverse proxy for the dashboard (installed by: install.sh --with-nginx --tls ...).
# Passwords and session cookies are encrypted on the office Wi-Fi, and
# browsers allow the clipboard API (the "Copy URL" button) only over HTTPS.
# RTSP (8554) is not proxied; MediaMTX serves it directly.

upstream rtsp_manager {
    server 127.0.0.1:8080;
    keepalive 8;
}

server {
    listen 80;
    listen [::]:80;
    server_name _;
    return 301 https://$host$request_uri;
}

server {
    # 'listen ... ssl http2' works on nginx 1.22 (Debian 12) and newer
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name _;

    ssl_certificate     /etc/rtsp-manager/tls/server.crt;
    ssl_certificate_key /etc/rtsp-manager/tls/server.key;
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_session_cache shared:rig02:1m;
    add_header Strict-Transport-Security "max-age=31536000" always;

    # Multi-GB uploads stream straight to the backend (it checks disk space first)
    client_max_body_size 64g;
    proxy_request_buffering off;
    proxy_buffering off;
    proxy_http_version 1.1;
    proxy_read_timeout 3600s;
    proxy_send_timeout 3600s;

    location / {
        proxy_pass http://rtsp_manager;
        proxy_set_header Host $host;
        proxy_set_header Connection "";
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto https;
    }
}
