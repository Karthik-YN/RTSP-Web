# Optional: let live transcoding use an NVIDIA graphics card (NVENC).
#
# Needs the NVIDIA driver and the NVIDIA Container Toolkit on the server
# (check: docker run --rm --gpus all nvidia/cuda:12.6.3-base-ubuntu24.04 nvidia-smi).
#
#   docker compose -f docker-compose.yml -f docker-compose.gpu-nvidia.yml up -d
#
# Then Health -> Video encoding -> "Check again": NVIDIA should show as working; "Auto" uses it.
services:
  rig02:
    environment:
      NVIDIA_DRIVER_CAPABILITIES: compute,video,utility
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: all
              capabilities: [gpu, video]
