[pytest]
testpaths = tests
pythonpath = backend tests
timeout = 300
addopts = -ra -m "not long and not performance"
markers =
    integration: uses real FFmpeg + MediaMTX processes (skipped if binaries are missing)
    performance: multi-stream load measurements (run with: pytest -m performance)
    long: long-running soak tests, e.g. 30-minute loop (run with: pytest -m long)
filterwarnings =
    ignore::DeprecationWarning
